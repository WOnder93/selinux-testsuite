name: checks
on: [push, pull_request]

jobs:
  style-check:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - run: sudo dnf install -y astyle perltidy findutils git-core
      - uses: actions/checkout@v4
      - run: sudo chown $(id -u):$(id -g) .
      - run: tools/check-syntax -f && git diff --exit-code
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [unconfined_t, sysadm_t]
        arch: [x86_64, aarch64]
        system:
          - { compose: Fedora-latest,    kernel: latest }
          - { compose: Fedora-Rawhide,   kernel: secnext }
          - { compose: CentOS-Stream-9,  kernel: latest }
          - { compose: CentOS-Stream-10, kernel: latest }
    steps:
      - name: Schedule test on Testing Farm
        uses: sclorg/testing-farm-as-github-action@main
        with:
          api_key: ${{ secrets.TESTING_FARM_API_TOKEN }}
          arch: ${{ matrix.arch }}
          compose: ${{ matrix.system.compose }}
          variables: STS_ROOT_DOMAIN=${{ matrix.domain }}; STS_KERNEL=${{ matrix.system.kernel }}
          tmt_plan_filter: tag:ci
